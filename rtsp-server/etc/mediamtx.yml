# mediamtx 1.21.1 configuration.
#
# Only settings that differ from the upstream defaults are listed here;
# everything else falls back to the built-in defaults. Full reference:
# https://github.com/bluenviron/mediamtx/blob/v1.21.1/mediamtx.yml
#
# This file must be mounted at /mediamtx.yml in the container: mediamtx only
# searches ./mediamtx.yml, /usr/local/etc, /usr/etc and /etc/mediamtx/, so a
# file at /etc/mediamtx.yml is silently ignored.

logLevel: info
logDestinations: [stdout]

# The Pi cameras publish over TCP (camera/rtsp-stream.sh passes
# -rtsp_transport tcp) and only the TCP ports are published by the container,
# so do not advertise the UDP/multicast transports.
rtspTransports: [tcp]

authInternalUsers:
  # Cameras publish anonymously - camera/rtsp-stream.sh carries no credentials.
  - user: any
    pass:
    ips: []
    permissions:
      - action: publish
        path:

  # Home Assistant reads the streams. Hash carried over from the 0.22 config.
  # Generate a replacement with:
  #   echo -n 'the-password' | openssl dgst -binary -sha256 | openssl base64
  - user: homeassistant
    pass: sha256:sTOgwOm+474gFj0q0x1iSNspKqbcse4IeiqlDg/HWuI=
    ips: []
    permissions:
      - action: read
        path:
      - action: playback
        path:

  # API/metrics/pprof stay loopback-only (upstream default entry).
  - user: any
    pass:
    ips: ["127.0.0.1", "::1"]
    permissions:
      - action: api
      - action: metrics
      - action: pprof

paths:
  # Every stream is created by whoever publishes to it; the path name is the
  # camera's object_id (see camera/rtsp-stream.sh).
  all_others:
