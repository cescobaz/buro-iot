#!/bin/ansible-playbook
#
# Decrypts the vault vars needed for manual testing into ./credentials.env,
# which is gitignored. Nothing is printed: the task is no_log, so the secrets
# go from the vault straight to the file.
#
#   ansible-playbook --vault-password-file .vault-password write-credentials.yml
#   set -a; . ./credentials.env; set +a
#
# Runs entirely on the control machine - it contacts no host.

- hosts: mosquitto
  connection: local
  gather_facts: no
  tasks:
    - name: Write credentials.env
      ansible.builtin.copy:
        dest: "{{ playbook_dir }}/credentials.env"
        mode: '0600'
        content: |
          # Generated by write-credentials.yml - gitignored, do not commit.
          # Regenerate after rotating any of these in inventory.yml.

          # MQTT broker
          MQTT_HOST=mqtt.burelli.xyz
          MQTT_PORT=8883
          MQTT_USER={{ tester_mqtt_username }}
          MQTT_PASS={{ tester_mqtt_password }}
          MQTT_URL=mqtt://{{ tester_mqtt_username }}:{{ tester_mqtt_password }}@mqtt.burelli.xyz:8883

          # Camera on raspi-1 (iot_area=living)
          CAM_CMD_TOPIC={{ hostvars['raspi-1'].device_name }}/select/{{ hostvars['raspi-1'].iot_area }}-camera-mqtt-state/commands
          CAM_STATE_TOPIC={{ hostvars['raspi-1'].device_name }}/select/{{ hostvars['raspi-1'].iot_area }}-camera-mqtt-state/state

          # RTSP stream (read credentials; publishing is anonymous)
          RTSP_READ_USER={{ rtsp_read_user }}
          RTSP_READ_PASS={{ rtsp_read_password }}
          RTSP_URL=rtsp://{{ rtsp_read_user }}:{{ rtsp_read_password }}@rtsp.burelli.xyz:8554/{{ hostvars['raspi-1'].iot_area }}-camera-mqtt
      no_log: true
